apiVersion: apps/v1
kind: Deployment
metadata:
  name: beer-vote-java
  labels:
    app: beer-vote
    runtime: java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beer-vote
      runtime: java
  template:
    metadata:
      labels:
        app: beer-vote
        runtime: java
    spec:
      containers:
        - name: beer-vote
          image: ghcr.io/pabelyakov/beer-vote:java
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beer-vote-java
  labels:
    app: beer-vote
    runtime: java
spec:
  type: NodePort
  selector:
    app: beer-vote
    runtime: java
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30003
